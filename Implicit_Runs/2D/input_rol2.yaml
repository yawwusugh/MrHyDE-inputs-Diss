%YAML 1.1
---
ANONYMOUS:
  Analysis:
    analysis type: ROL2
    ROL2:
      General:
        Output Level: 3
        Do magnitude scan: false
        Do grad+hessvec check: false # true   - make true when checking
        Do exact hessvec check: false # true   - make true when checking
        Do algebraic hessvec check: false # true   - make true when checking
        Do secant identity check: false # true   - make true when checking
        FD Scale: 1.0e-17      # scales the check direction d
        FD Check Seed: 42      # reproducible direction seed
        Bound Optimization Variables: false
        Inexact Objective Function: false
        Inexact Gradient: false
        Inexact Hessian-Times-A-Vector: false
        Projected Gradient Criticality Measure: false
        Secant:
          Type: Limited-Memory BFGS
          Use as Preconditioner: false
          Use as Hessian: false            # force TR-CG to call obj->hessVec
          Maximum Storage: 20
          Barzilai-Borwein Type: 1
          Use Default Scaling: true
        Krylov:
          Type: Conjugate Gradients
          Absolute Tolerance: 1.0e+30   # only the Relative Tolerance stops CG
          Relative Tolerance: 1.0e-8
          Iteration Limit: 1000
      Step:
        Type: Trust Region
        Trust Region:
          Subproblem Solver: Truncated CG
          Initial Radius: 1.0e+08
          Maximum Radius: 5.0e+18
          Step Acceptance Threshold: 5.0e-02
          Radius Shrinking Threshold: 5.0e-02
          Radius Growing Threshold: 9.0e-01
          Radius Shrinking Rate (Negative rho): 6.25e-02
          Radius Shrinking Rate (Positive rho): 2.50e-01
          Radius Growing Rate: 10.0
          Safeguard Size: 1.0e+01
      Status Test:
        Gradient Tolerance: 1.0e-8
        Use Relative Tolerances: true
        Constraint Tolerance: 1.0e-08
        Step Tolerance: 1.0e-30
        Iteration Limit: 20
...
